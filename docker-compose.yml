services:
  app:
    build: .
    container_name: tienda-app
    env_file: .env
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tienda-net

  postgres:
    image: postgres:16-alpine
    container_name: tienda-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tienda-net

  # Mensajería: activar cuando existan tareas asíncronas reales
  # rabbitmq:
  #   image: rabbitmq:3.13-management-alpine
  #   container_name: tienda-rabbit
  #   environment:
  #     RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
  #     RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  #   ports:
  #     - "${RABBITMQ_PORT}:5672"
  #     - "${RABBITMQ_MGMT_PORT}:15672"
  #   networks:
  #     - tienda-net

volumes:
  postgres_data:

networks:
  tienda-net:
    driver: bridge

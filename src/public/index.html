<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda Online</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f5f7fa;
               display: flex; align-items: center; justify-content: center;
               min-height: 100vh; margin: 0; }
        .card { background: white; padding: 3rem; border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center;
                max-width: 500px; }
        h1 { color: #2c3e50; margin-bottom: 1rem; }
        h1 span { color: #e67e22; }
        p { color: #7f8c8d; line-height: 1.6; }
        .status { margin-top: 1.5rem; padding: 0.8rem 1.2rem;
                  background: #e8f8ef; color: #229954; border-radius: 6px;
                  font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sistema de <span>Pedidos</span></h1>
        <p>Tienda en línea — gestión de pedidos desde confirmación hasta despacho.</p>
        <div class="status">✅ Backend corriendo</div>
        <p style="margin-top:1.5rem; font-size:0.85rem;">
            Endpoint de prueba: <code>/api/v1/info</code>
        </p>
    </div>
</body>
</html>
